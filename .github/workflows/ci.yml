name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin lint and contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run plugin contract tests
        run: node --test tests/*.test.cjs
      - name: Install Selene
        run: cargo install selene --locked --version 0.32.0
      - name: Lint Roblox plugin
        run: selene --allow-warnings MoonHubBridge.plugin.lua

  docs:
    name: Build developer docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Verify docs output
        run: test -s _site/index.html
